name: media-manager

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_manager}
      POSTGRES_USER: ${POSTGRES_USER:-media_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: .
      target: api
      args:
        VERSION: ${MEDIA_MANAGER_VERSION:-development}
        COMMIT: ${MEDIA_MANAGER_COMMIT:-local}
    restart: unless-stopped
    user: ${MEDIA_MANAGER_UID:-65532}:${MEDIA_MANAGER_GID:-65532}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-media_manager}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-media_manager}
      PGSSLMODE: disable
      OWNER_TOKEN: ${OWNER_TOKEN:?set a random OWNER_TOKEN of at least 32 characters}
      AUTO_MIGRATE: "true"
      LISTEN_ADDR: 0.0.0.0:8080
      COMMISSIONING_V2_OWNER_ORIGIN: ${COMMISSIONING_V2_OWNER_ORIGIN:-}
      SEERR_BASE_URL: ${SEERR_BASE_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      SEERR_INSTANCE_ID: ${SEERR_INSTANCE_ID:-}
      SEERR_WEBHOOK_SECRET: ${SEERR_WEBHOOK_SECRET:-}
      SEERR_ALLOW_HTTP: ${SEERR_ALLOW_HTTP:-false}
      TMDB_ACCESS_TOKEN_FILE: /run/secrets/media_manager_tmdb_token
      TVDB_API_KEY_FILE: /run/secrets/media_manager_tvdb_key
      SIMKL_CLIENT_ID_FILE: /run/secrets/media_manager_simkl_client_id
    env_file:
      - .env.integrations
    secrets:
      - media_manager_tmdb_token
      - media_manager_tvdb_key
      - media_manager_simkl_client_id
    volumes:
      - ${ALTMOUNT_HOST_PATH:?set ALTMOUNT_HOST_PATH}:/mnt/altmount:ro
      - ${MOVIES_HOST_PATH:?set MOVIES_HOST_PATH}:/libraries/movies:rw
      - ${TV_HOST_PATH:?set TV_HOST_PATH}:/libraries/tv:rw
      - ./data/backups:/var/lib/media-manager/backups:rw
    ports:
      - "127.0.0.1:${MEDIA_MANAGER_API_PORT:-28081}:8080"
    networks: [frontend, backend, integrations]

  ui:
    build:
      context: .
      target: ui
      args:
        NEXT_PUBLIC_MEDIA_MANAGER_MODE: live
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [frontend]

volumes:
  postgres-data:

secrets:
  media_manager_tmdb_token:
    file: ${METADATA_TMDB_TOKEN_SOURCE_FILE:-/dev/null}
  media_manager_tvdb_key:
    file: ${METADATA_TVDB_KEY_SOURCE_FILE:-/dev/null}
  media_manager_simkl_client_id:
    file: ${METADATA_SIMKL_CLIENT_ID_SOURCE_FILE:-/dev/null}

networks:
  frontend:
    internal: true
  backend:
    internal: true
  integrations:
    name: ${MEDIA_NETWORK:-media-manager}
    external: true
