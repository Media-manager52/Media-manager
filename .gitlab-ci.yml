stages:
  - verify

workflow:
  rules:
    # A merge request runs once, as a merge_request_event pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Do not also run a branch pipeline for a branch that already has an open
    # merge request. Without this guard GitLab creates two identical pipelines
    # for the same commit.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # A branch without an open merge request still runs normally, including main.
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

frontend:
  stage: verify
  image: node:24-bookworm
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
    npm_config_audit: "false"
    npm_config_fund: "false"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm/
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run docs:check
    - npm test
    - npm audit --omit=dev

browser:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
    npm_config_audit: "false"
    npm_config_fund: "false"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm/
  before_script:
    - npm ci
  script:
    - npm run test:browser

backend:
  stage: verify
  image: golang:1.27-bookworm
  services:
    - name: postgres:18.6-alpine3.24
      alias: postgres
  variables:
    POSTGRES_DB: media_manager_test
    POSTGRES_USER: media_manager
    POSTGRES_PASSWORD: media_manager_test
    DATABASE_URL: "postgres://media_manager:media_manager_test@postgres:5432/media_manager_test?sslmode=disable"
    MEDIA_MANAGER_TEST_DATABASE_URL: "postgres://media_manager:media_manager_test@postgres:5432/media_manager_test?sslmode=disable"
    OWNER_TOKEN: "ci-only-owner-token-0123456789abcdef"
    GOFLAGS: "-mod=readonly"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go/
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends postgresql-client
    - until pg_isready --host=postgres --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"; do sleep 1; done
  script:
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./cmd/... ./internal/...
    - go test -count=1 -race ./cmd/... ./internal/...
    - go run ./cmd/media-manager migrate
    - git diff --exit-code -- go.mod go.sum
