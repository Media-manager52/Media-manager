# Optional standalone edge for a self-hosted installation.
#
#   docker compose -f compose.yaml -f compose.standalone.yaml --profile lan up -d --build
#   docker compose -f compose.yaml -f compose.standalone.yaml --profile https up -d --build
#
# The `lan` profile serves HTTP on MEDIA_MANAGER_HTTP_PORT (default 8080).
# The `https` profile serves MEDIA_MANAGER_DOMAIN on ports 80/443 with automatic
# TLS. Both require a basic-auth login and inject the owner bearer server-side.
services:
  api:
    # Lets a host-run Plex/Seerr be reached as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  edge-lan:
    profiles: ["lan"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    environment:
      MEDIA_MANAGER_SITE: ":8080"
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH}
      OWNER_TOKEN: ${OWNER_TOKEN:?set OWNER_TOKEN}
    ports:
      - "${MEDIA_MANAGER_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/standalone/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [frontend, public]

  edge-https:
    profiles: ["https"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    environment:
      MEDIA_MANAGER_SITE: ${MEDIA_MANAGER_DOMAIN:-localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH}
      OWNER_TOKEN: ${OWNER_TOKEN:?set OWNER_TOKEN}
    ports:
      - "${MEDIA_MANAGER_ACME_PORT:-80}:80"
      - "${MEDIA_MANAGER_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/standalone/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [frontend, public]

volumes:
  caddy-data:
  caddy-config:

networks:
  # Caddy needs outbound access for ACME; the application networks stay private.
  public:
    driver: bridge
