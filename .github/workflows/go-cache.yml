name: Go build cache

# Branch verification only restores the Go build cache; this workflow is the
# one place that writes it, from main, so every branch starts warm. Caches
# written on main are readable by all branches; branch runs no longer write
# their own. On main the tests are normally reused from the merged branch, so
# nothing else on main compiles the race-enabled test binaries.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: go-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.3
          cache: false
      # Start from the previous main cache so only what changed is rebuilt,
      # then save a new entry for this commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The same builds as the Verify backend jobs, without running any test.
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -c -o "$RUNNER_TEMP/tests/" ./cmd/... ./internal/...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./cmd/... ./internal/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
