name: Deploy

on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful Verify run ID (blank selects the latest success for current main)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Deploy the verified main commit with backup and health checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: python3 scripts/ci/request-deployment.py
