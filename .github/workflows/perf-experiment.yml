name: Perf experiment

# Throwaway measurement workflow for the ci/maximum-performance work. It lives
# only on the experiment branch and is never part of the optimization PR.
on:
  push:
    branches: ["ci/maximum-performance-experiment"]

permissions:
  contents: read

concurrency:
  group: perf-experiment
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  # Control: byte-for-byte the backend job of main (old script, setup-go cache).
  vps-control:
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: media_manager_test
          POSTGRES_USER: media_manager
          POSTGRES_PASSWORD: media_manager_test
        ports: ["127.0.0.1:35432:5432"]
        options: >-
          --health-cmd "pg_isready -U media_manager -d media_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
      MEDIA_MANAGER_TEST_DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - name: control script, 4 shared-database shards
        run: bash scripts/ci/experiments/test-backend-main.sh

  # Treatment on the VPS: no setup-go cache restore, per-group databases.
  vps-new:
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: media_manager_test
          POSTGRES_USER: media_manager
          POSTGRES_PASSWORD: media_manager_test
          POSTGRES_INITDB_ARGS: >-
            -c max_locks_per_transaction=256 -c max_connections=200
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ["127.0.0.1:35432:5432"]
        options: >-
          --health-cmd "pg_isready -U media_manager -d media_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
      MEDIA_MANAGER_TEST_DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - name: confirm the tuned settings reached the server
        run: |
          PGPASSWORD=media_manager_test psql -h 127.0.0.1 -p 35432 -U media_manager -d media_manager_test -Atc \
            "select name||'='||setting from pg_settings where name in ('max_locks_per_transaction','max_connections','fsync','synchronous_commit','full_page_writes') order by 1"
      - name: latency probe, service container over rootless Docker TCP
        run: |
          bash scripts/ci/experiments/latency-probe.sh service-tcp 127.0.0.1 35432 media_manager media_manager_test
          bash scripts/ci/experiments/latency-probe.sh service-tcp 127.0.0.1 35432 media_manager media_manager_test
      - name: new script, 4 shards
        env: {BACKEND_TEST_SHARDS: "4"}
        run: bash scripts/ci/test-backend.sh
      - name: new script, 6 shards
        continue-on-error: true
        env: {BACKEND_TEST_SHARDS: "6"}
        run: bash scripts/ci/test-backend.sh
      - name: new script, 8 shards
        continue-on-error: true
        env: {BACKEND_TEST_SHARDS: "8"}
        run: bash scripts/ci/test-backend.sh
      - name: new script, 4 shards (repeat for noise)
        env: {BACKEND_TEST_SHARDS: "4"}
        run: bash scripts/ci/test-backend.sh
      - run: go run ./cmd/media-manager migrate
      - run: git diff --exit-code -- go.mod go.sum

  # Where does the time go in the Docker path? Compare transports and settings.
  vps-probe:
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: own container, TCP, default settings vs tuned, and unix socket
        env:
          IMAGE: postgres:18.6-alpine3.24
        run: |
          set -euo pipefail
          tag="mm-ci-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sock="${RUNNER_TEMP}/pgsock"
          mkdir -p "$sock"; chmod 0777 "$sock"
          cleanup() { docker rm -f "${tag}-tcp" "${tag}-tuned" "${tag}-sock" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          pw="$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
          wait_ready() { for _ in $(seq 60); do docker exec "$1" pg_isready -U media_manager >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          # A: default settings over a published loopback port.
          docker run -d --name "${tag}-tcp" -e POSTGRES_PASSWORD="$pw" -e POSTGRES_USER=media_manager -p 127.0.0.1::5432 "$IMAGE" >/dev/null
          wait_ready "${tag}-tcp"
          port="$(docker port "${tag}-tcp" 5432/tcp | head -1 | sed 's/.*://')"
          bash scripts/ci/experiments/latency-probe.sh own-container-tcp-default 127.0.0.1 "$port" media_manager "$pw"
          # B: tuned (disposable) settings over a published loopback port.
          docker run -d --name "${tag}-tuned" -e POSTGRES_PASSWORD="$pw" -e POSTGRES_USER=media_manager -p 127.0.0.1::5432 "$IMAGE" \
            postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_locks_per_transaction=256 -c max_connections=200 >/dev/null
          wait_ready "${tag}-tuned"
          port="$(docker port "${tag}-tuned" 5432/tcp | head -1 | sed 's/.*://')"
          bash scripts/ci/experiments/latency-probe.sh own-container-tcp-tuned 127.0.0.1 "$port" media_manager "$pw"
          # C: tuned settings, unix socket bind-mounted to the host.
          docker run -d --name "${tag}-sock" -e POSTGRES_PASSWORD="$pw" -e POSTGRES_USER=media_manager -v "$sock:/var/run/postgresql" "$IMAGE" \
            postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_locks_per_transaction=256 -c max_connections=200 >/dev/null
          wait_ready "${tag}-sock"
          ls -la "$sock" || true
          bash scripts/ci/experiments/latency-probe.sh own-container-unix-socket "$sock" 5432 media_manager "$pw" || echo "unix socket probe failed"

  hosted-new:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: media_manager_test
          POSTGRES_USER: media_manager
          POSTGRES_PASSWORD: media_manager_test
          POSTGRES_INITDB_ARGS: >-
            -c max_locks_per_transaction=256 -c max_connections=200
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports: ["127.0.0.1:35432:5432"]
        options: >-
          --health-cmd "pg_isready -U media_manager -d media_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
      MEDIA_MANAGER_TEST_DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:35432/media_manager_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
          cache: true
          cache-dependency-path: go.sum
      - run: nproc && free -m
      - name: latency probe, hosted Docker TCP
        run: bash scripts/ci/experiments/latency-probe.sh hosted-service-tcp 127.0.0.1 35432 media_manager media_manager_test
      - name: new script, 4 shards
        env: {BACKEND_TEST_SHARDS: "4"}
        run: bash scripts/ci/test-backend.sh
      - name: new script, 6 shards
        continue-on-error: true
        env: {BACKEND_TEST_SHARDS: "6"}
        run: bash scripts/ci/test-backend.sh

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: single-w1, shard: "", workers: "1"}
          - {id: single-w3, shard: "", workers: "3"}
          - {id: shard-1of2-w1, shard: "1/2", workers: "1"}
          - {id: shard-2of2-w1, shard: "2/2", workers: "1"}
          - {id: shard-1of2-w2, shard: "1/2", workers: "2"}
          - {id: shard-2of2-w2, shard: "2/2", workers: "2"}
          - {id: shard-1of2-w3, shard: "1/2", workers: "3"}
          - {id: shard-2of2-w3, shard: "2/2", workers: "3"}
    name: browser ${{ matrix.id }}
    env:
      PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: nproc && free -m
      - run: npm ci
      - run: npm run build
      - name: playwright (${{ matrix.id }})
        run: npx playwright test ${{ matrix.shard != '' && format('--shard={0}', matrix.shard) || '' }}

  vps-containers:
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate and smoke the isolated stack
        run: python3 scripts/ci/container-smoke.py
