name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: media_manager_test
          POSTGRES_USER: media_manager
          POSTGRES_PASSWORD: media_manager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U media_manager -d media_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:5432/media_manager_test?sslmode=disable
      MEDIA_MANAGER_TEST_DATABASE_URL: postgres://media_manager:media_manager_test@127.0.0.1:5432/media_manager_test?sslmode=disable
      OWNER_TOKEN: 0123456789abcdef0123456789abcdef
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go test -count=1 -race ./cmd/... ./internal/...
      - run: go run ./cmd/media-manager migrate
      - run: git diff --exit-code -- go.mod go.sum

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate and smoke the supported stack
        run: |
          cp .env.integrations.example .env.integrations
          mkdir -p /tmp/media-manager-ci/altmount /tmp/media-manager-ci/movies /tmp/media-manager-ci/tv
          export POSTGRES_PASSWORD=media-manager-ci-database-password
          export OWNER_TOKEN=0123456789abcdef0123456789abcdef
          export OWNER_USERNAME=owner
          export OWNER_PASSWORD_HASH="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext owner-test)"
          export ALTMOUNT_HOST_PATH=/tmp/media-manager-ci/altmount
          export MOVIES_HOST_PATH=/tmp/media-manager-ci/movies
          export TV_HOST_PATH=/tmp/media-manager-ci/tv
          export MEDIA_NETWORK=media-manager-ci-${GITHUB_RUN_ID}
          export MEDIA_MANAGER_PORT=18080
          export MEDIA_MANAGER_VERSION=ci-${GITHUB_RUN_ID}
          export MEDIA_MANAGER_COMMIT=${GITHUB_SHA}
          docker network create "${MEDIA_NETWORK}"
          trap 'docker compose down -v; docker network rm "${MEDIA_NETWORK}"' EXIT
          docker compose config >/dev/null
          docker run --rm -e OWNER_TOKEN -e OWNER_USERNAME -e OWNER_PASSWORD_HASH -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose build
          docker compose up -d --wait
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 401
          test "$(curl -sS -u owner:owner-test -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 200
          test "$(curl -sS -u owner:owner-test -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/ready)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/v1/integrations/seerr/webhook)" = 503
          docker compose exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' >/tmp/media-manager-ci.dump
          test -s /tmp/media-manager-ci.dump
