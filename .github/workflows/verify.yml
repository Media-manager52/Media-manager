name: Verify

on:
  # There is intentionally no pull_request trigger: a public repository must
  # never execute code from a fork pull request on the self-hosted runner.
  # Same-repository pushes are trusted. Frontend/browser checks run on
  # GitHub-hosted runners; the self-hosted runner hosts backend, container and
  # publish work that needs the owner's rootless Docker engine.
  push:
  workflow_dispatch:

concurrency:
  # Main verification is grouped per commit so a newer main push cannot replace
  # a queued verification for an earlier merge. Feature branches keep one group
  # per ref so a superseded push can cancel its own earlier run.
  group: verify-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# This workflow intentionally has no pull_request trigger: fork code is never
# executed on the owner's runner. Fork PRs are reviewed and validated by a
# trusted push after review. Frontend/browser jobs are public-repository-safe
# GitHub-hosted work and carry no production secrets.
jobs:
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run docs:check
      - run: python3 -m unittest discover -s tests/ci -v
      - run: npm test

  # The browser suite is split into two independent hosted jobs. Each shard
  # runs with PLAYWRIGHT_WORKERS parallel workers. The aggregate `browser` job
  # below keeps the required job name stable for branch protection and the
  # deployment broker.
  browser-shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: browser-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same pinned image as the GitLab browser job, so browsers match @playwright/test.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:browser -- --shard=${{ matrix.shard }}
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: .sites-runtime/playwright-results
          retention-days: 7

  browser:
    needs: browser-shard
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every browser shard must have passed
        env:
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          echo "browser shards: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = "success"

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 30
    env:
      OWNER_TOKEN: 0123456789abcdef0123456789abcdef
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
          # The persistent runner keeps its own GOCACHE/GOMODCACHE and Go
          # toolchain. Restoring a ~900 MB actions cache over them cost about
          # 23 s per job plus a post-job save.
          cache: false
      # Disposable PostgreSQL on the rootless engine, reachable only through a
      # unix socket in RUNNER_TEMP (no published port, random password). It
      # exports MEDIA_MANAGER_TEST_DATABASE_URL and DATABASE_URL for later steps
      # and initialises while gofmt and vet run.
      - run: bash scripts/ci/postgres-container.sh start
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: bash scripts/ci/postgres-container.sh wait
      - run: bash scripts/ci/test-backend.sh
        env:
          BACKEND_TEST_SHARDS: "6"
      - run: go run ./cmd/media-manager migrate
      - run: git diff --exit-code -- go.mod go.sum
      - if: always()
        run: bash scripts/ci/postgres-container.sh stop

  containers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate and smoke the isolated stack
        run: python3 scripts/ci/container-smoke.py

  publish:
    needs: [frontend, browser, backend, containers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, media-manager-vps]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Upload tested images to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-images.sh
